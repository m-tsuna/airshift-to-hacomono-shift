<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>練習用 hacomono シフト表（本物ではありません）</title>
<!--
  本物の hacomono のシフト画面（2026-11-18 に読んだ作り）に似せた練習用ページ。
  - 表：table.m_table、マス td.item（休みは unactive）、年月 input.period-form
  - マスを押すと「スタッフシフト設定」の窓。欄は [role=group][aria-label=...]
  - 本物（Vue）と同じく、値は input イベントを受けたときだけ覚える（.value を直接変えても保存されない）
  - 保存すると少し待ってから表が新しくなる。終了が開始より前だと赤い文字のエラーで閉じない
  名前・番号は架空のもの
-->
<style>
  body { font-family: sans-serif; font-size: 12px; }
  .banner { background:#fff3cd; padding:6px; margin-bottom:6px; }
  table.m_table td, table.m_table th { border:1px solid #ccc; padding:2px 4px; white-space:nowrap; }
  td.item { cursor:pointer; } td.item.unactive { color:#aaa; }
  th.holiday { color:#c00; }
  .l_modal { position:fixed; inset:0; background:rgba(0,0,0,.3); }
  .m_modal { background:#fff; width:420px; margin:30px auto; padding:10px; max-height:85vh; overflow:auto; }
  .error { color:#c00; }
</style>
</head>
<body>
<div class="banner">練習用のページです（本物の hacomono ではありません）。</div>
<div>表示月 <input type="text" maxlength="6" class="w_80 period-form"></div>
<div id="tableBox"></div>
<div id="modalBox"></div>

<script>
// ---- 練習用のデータ（2026年1月）----
const YEAR = 2026, MONTH = 1, DAYS = 31;
const HOLIDAYS = [1, 12];                 // 元日・成人の日
const STAFF = [
  { code: "IN0001", name: "テスト 店長" },
  { code: "IN0002", name: "スタッフ A" },
  { code: "IN0003", name: "スタッフ B" },
];
// shifts[code][day] = { off, start, end, blocks: [{start,end,name}] }
const shifts = {};
for (const s of STAFF) { shifts[s.code] = {}; for (let d = 1; d <= DAYS; d++) shifts[s.code][d] = { off: true, start: "", end: "", blocks: [] }; }
// 最初から入っているマス（テストの都合で外から書き換えられるように window に出す）
window.__mock = { shifts, saveCount: 0, render: () => renderTable() };

document.querySelector(".period-form").value = "" + YEAR + String(MONTH).padStart(2, "0");
const WD = ["日","月","火","水","木","金","土"];

function renderTable() {
  let h = '<table class="m_table"><tr><th class="sticky_fix"></th>';
  for (let d = 1; d <= DAYS; d++) {
    const wd = new Date(YEAR, MONTH - 1, d).getDay();
    const cls = ["sticky_header", "weekday"]; if (HOLIDAYS.includes(d)) cls.push("holiday");
    h += '<th class="' + cls.join(" ") + '">' + d + '日 (' + WD[wd] + ')</th>';
  }
  h += '</tr><tr><th class="sticky">営業時間</th>' + '<td class="fix_item"><div><button type="button">編集</button></div></td>'.repeat(DAYS) + '</tr>';
  h += '<tr><th class="sticky">午前</th>' + '<td class="text-center">0人</td>'.repeat(DAYS) + '</tr>';
  h += '<tr><th class="sticky">午後</th>' + '<td class="text-center">0人</td>'.repeat(DAYS) + '</tr>';
  for (const s of STAFF) {
    h += '<tr><th class="sticky fw_normal"><div class="flex"><div class="label"><a href="#/x">[' + s.code + ']<br>' + s.name + '</a></div></div></th>';
    for (let d = 1; d <= DAYS; d++) {
      const v = shifts[s.code][d];
      h += '<td class="item' + (v.off ? ' unactive' : '') + '" data-code="' + s.code + '" data-day="' + d + '"><div class="flex">' +
        (v.off ? '休' : v.start + '-' + v.end) + '</div></td>';
    }
    h += '</tr>';
  }
  document.getElementById("tableBox").innerHTML = h + '</table>';
  document.querySelectorAll("td.item").forEach((td) => td.addEventListener("click", () => openModal(td.dataset.code, +td.dataset.day)));
}

// ---- 窓（スタッフシフト設定）----
let model = null; // 窓で編集中の値（input イベントでだけ変わる）
function openModal(code, day) {
  const v = shifts[code][day];
  model = { code, day, off: v.off, start: v.start, end: v.end, blocks: v.blocks.map((b) => ({ ...b })), error: "" };
  setTimeout(renderModal, 200); // 本物も少し遅れて開く
}
function renderModal() {
  if (!model) { document.getElementById("modalBox").innerHTML = ""; return; }
  const s = STAFF.find((x) => x.code === model.code);
  const date = YEAR + "-" + String(MONTH).padStart(2, "0") + "-" + String(model.day).padStart(2, "0");
  let blocks = "";
  if (model.blocks.length === 0) blocks = '<div><button type="button" class="m_button add-block"><i class="fa fa-plus"></i>予定ブロックを追加</button></div>';
  else blocks = model.blocks.map((b, i) =>
    '<div class="mb_1"><input type="time" data-b="' + i + '" data-f="start" value="' + b.start + '"> → <input type="time" data-b="' + i + '" data-f="end" value="' + b.end + '">' +
    ' <button type="button">+</button><button type="button">×</button>' +
    '<div><label class="label">予定ブロック名</label><div class="input-autocomplete"><input type="text" placeholder="例：昼休み" data-b="' + i + '" data-f="name" value="' + b.name + '"></div></div></div>').join("");
  document.getElementById("modalBox").innerHTML =
    '<div class="center"><div class="l_modal"><div><div class="m_modal"><div class="inner f_formgroup_container lg">' +
    '<div class="m_modal_header">スタッフシフト設定 <button type="button" class="close-button" aria-label="閉じる">×</button></div>' +
    '<form method="post">' +
    '<div aria-label="スタッフ" role="group" class="f_formgroup">スタッフ <div>[' + s.code + ']' + s.name + '</div></div>' +
    '<div aria-label="日付" role="group" class="f_formgroup">日付 <input type="text" disabled class="w_110"></div>' +
    '<div aria-label="シフト設定" role="group" class="f_formgroup">シフト設定 <span class="m_badge">必須</span>' +
    '<div><label><input type="checkbox" class="off-cb" value="1">休日</label></div>' +
    '<div><input type="time" class="sh" data-f="start"' + (model.off ? ' disabled' : '') + '> → <input type="time" class="sh" data-f="end"' + (model.off ? ' disabled' : '') + '> <button type="button">+</button></div></div>' +
    '<div aria-label="予定ブロック設定" role="group" class="f_formgroup">予定ブロック設定' + blocks + '</div>' +
    (model.error ? '<p class="error">' + model.error + '</p>' : '') +
    '</form>' +
    '<div class="m_modal_footer"><button type="button" class="m_button base close2">閉じる</button><div class="right"><button type="submit" class="m_button success">保存する</button></div></div>' +
    '</div></div></div></div></div>';
  const box = document.getElementById("modalBox");
  // 本物（Vue）と同じく、値はプログラムの側から入れる（HTML の value 属性ではない）
  box.querySelector('[aria-label="日付"] input').value = date;
  box.querySelector(".off-cb").checked = model.off;
  const sh = box.querySelectorAll(".sh");
  sh[0].value = model.off ? "" : model.start; sh[1].value = model.off ? "" : model.end;
  box.querySelector(".off-cb").addEventListener("change", (e) => { model.off = e.target.checked; renderModal(); });
  sh.forEach((inp) => inp.addEventListener("input", () => { model[inp.dataset.f] = inp.value; }));
  box.querySelectorAll("[data-b]").forEach((inp) => inp.addEventListener("input", () => { model.blocks[+inp.dataset.b][inp.dataset.f] = inp.value; }));
  const add = box.querySelector(".add-block");
  if (add) add.addEventListener("click", () => { model.blocks.push({ start: "", end: "", name: "" }); renderModal(); });
  box.querySelector(".close-button").addEventListener("click", closeModal);
  box.querySelector(".close2").addEventListener("click", closeModal);
  box.querySelector('button[type="submit"]').addEventListener("click", save);
}
function closeModal() { model = null; renderModal(); }
function save() {
  if (!model.off && (!model.start || !model.end || model.start >= model.end)) {
    model.error = "終了時間は開始時間より後にしてください"; renderModal(); return;
  }
  const v = shifts[model.code][model.day];
  v.off = model.off; v.start = model.off ? "" : model.start; v.end = model.off ? "" : model.end;
  v.blocks = model.blocks.filter((b) => b.start && b.end);
  window.__mock.saveCount++;
  model = null; renderModal();
  setTimeout(renderTable, 400); // 本物も保存のあと少し遅れて表が新しくなる
}
renderTable();
</script>
</body>
</html>
